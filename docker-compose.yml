version: '3.8'

services:
  taxisrilanka:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taxisrilanka-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=https://taxisrilanka.com
      # Add your database connection environment variables
      # - DATABASE_URL=postgresql://taxisrilanka_user:root@82.25.180.10:5432/taxisrilanka_prod_db
    networks:
      - taxisrilanka-network



  nginx:
    image: nginx:alpine
    container_name: taxisrilanka-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # Mount SSL certificates
    depends_on:
      - taxisrilanka
    networks:
      - taxisrilanka-network

networks:
  taxisrilanka-network:
    driver: bridge

