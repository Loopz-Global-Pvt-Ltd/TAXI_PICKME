version: '3.8'

services:
  taxisrilanka:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taxisrilanka-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=https://taxisrilanka.com
    networks:
      - taxisrilanka-network

  nginx:
    image: nginx:alpine
    container_name: taxisrilanka-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    command: [nginx, '-g', 'daemon off;']
    depends_on:
      - taxisrilanka
    networks:
      - taxisrilanka-network

networks:
  taxisrilanka-network:
    driver: bridge