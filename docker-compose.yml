version: '3.8'

services:
  taxisrilanka:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taxisrilanka-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=https://taxisrilanka.com
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=https://taxisrilanka.com
      - DATABASE_URL=postgresql://taxisrilanka_user:YourStrongPassword@172.17.0.1:5432/taxisrilanka_prod_db
      - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
      - ONEPAY_APP_ID=${ONEPAY_APP_ID}
      - ONEPAY_APP_TOKEN=${ONEPAY_APP_TOKEN}
      - ONEPAY_HASH_SALT=${ONEPAY_HASH_SALT}
      - ONEPAY_CURRENCY=LKR
      - ONEPAY_API_URL=https://api.onepay.lk/v3
      - ONEPAY_CALLBACK_URL=https://www.taxisrilanka.com/api/payments/callback
    networks:
      - taxisrilanka-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s



  nginx:
    image: nginx:alpine
    container_name: taxisrilanka-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # Mount SSL certificates
    depends_on:
      - taxisrilanka
    networks:
      - taxisrilanka-network

networks:
  taxisrilanka-network:
    driver: bridge

