version: '3.8'

services:
  taxipickme:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taxipickme-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=https://taxipickme.com
    networks:
      - taxipickme-network

  nginx:
    image: nginx:alpine
    container_name: taxipickme-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - taxipickme
    networks:
      - taxipickme-network

  certbot:
    image: certbot/certbot
    container_name: taxipickme-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - taxipickme-network

networks:
  taxipickme-network:
    driver: bridge
