version: '3.8'

services:
  taxisrilanka:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taxisrilanka-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=https://taxisrilanka.com
    networks:
      - taxisrilanka-network

  nginx:
    image: nginx:alpine
    container_name: taxisrilanka-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - taxisrilanka
    networks:
      - taxisrilanka-network

  certbot:
    image: certbot/certbot
    container_name: taxisrilanka-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - taxisrilanka-network

networks:
  taxisrilanka-network:
    driver: bridge
